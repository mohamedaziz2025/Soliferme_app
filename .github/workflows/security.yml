name: Security - Vulnerability Scan

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  push:
    paths:
      - 'Backend/package*.json'
      - 'Backend/requirements.txt'
      - 'Frontend/package*.json'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scanning:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [Backend, Frontend]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.service != 'Backend' || hashFiles('./Backend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        if: matrix.service == 'Backend'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run npm audit
        if: matrix.service != 'Backend' || hashFiles('./Backend/package.json') != ''
        working-directory: ./${{ matrix.service }}
        run: |
          npm ci
          npm audit --json > npm-audit.json || true
          cat npm-audit.json

      - name: Run pip-audit
        if: matrix.service == 'Backend'
        working-directory: ./Backend
        run: |
          pip install pip-audit
          pip-audit --desc || true

      - name: Upload npm audit results
        if: matrix.service != 'Backend' && hashFiles('./Backend/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.service }}
          path: ./${{ matrix.service }}/npm-audit.json

  container-scanning:
    name: Container Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        image:
          - Backend
          - Frontend
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.image }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'
          category: 'trivy-${{ matrix.image }}'

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trufflehogg
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Run GitGuardian scan
        uses: GitGuardian/ggshield-action@master
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          path: ./
          args: --all-policies
        continue-on-error: true

  codeql-scan:
    name: CodeQL Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: ['javascript', 'python']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scanning, container-scanning, secrets-detection, codeql-scan]
    if: always()

    steps:
      - name: Generate security report
        run: |
          echo "## Security Scan Report"
          echo "- Dependency Scanning: ${{ needs.dependency-scanning.result }}"
          echo "- Container Scanning: ${{ needs.container-scanning.result }}"
          echo "- Secrets Detection: ${{ needs.secrets-detection.result }}"
          echo "- CodeQL Analysis: ${{ needs.codeql-scan.result }}"
