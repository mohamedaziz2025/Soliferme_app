name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Backend Tests
  backend-test:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run Backend Linter
        working-directory: ./Backend
        run: npm run lint --if-present || echo "No lint script"

      - name: Run Backend Tests
        working-directory: ./Backend
        run: npm test --if-present || echo "No test script"
        env:
          MONGODB_URI: mongodb://localhost:27017/fruitytrack-test
          NODE_ENV: test

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v3
        with:
          context: ./Backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fruitytrack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Frontend Tests
  frontend-test:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run Frontend Linter
        working-directory: ./Frontend
        run: npm run lint --if-present || echo "No lint script"

      - name: Run Frontend Tests
        working-directory: ./Frontend
        run: npm test -- --watchAll=false --passWithNoTests || echo "No test script"
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:3000

      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build
        env:
          CI: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v3
        with:
          context: ./Frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fruitytrack-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AI Service Tests
  ai-service-test:
    name: AI Service - Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        working-directory: ./Backend
        run: pip install -r requirements.txt

      - name: Run AI Service Tests
        working-directory: ./Backend
        run: python -m pytest tests/ --if-exists || echo "No tests found"

      - name: Build AI Docker Image
        uses: docker/build-push-action@v3
        with:
          context: ./Backend
          dockerfile: Backend/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fruitytrack-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Flutter Mobile Build Check
  flutter-build:
    name: Flutter - Mobile App Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: ./app2
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./app2
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: ./app2
        run: flutter test --coverage --if-exists || echo "No tests"

      - name: Build Flutter Web
        working-directory: ./app2
        run: flutter build web --release --no-sound-null-safety || echo "Web build skipped"

  # Code Quality Check
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Docker Image Security Scan
  security-scan:
    name: Security - Container & Dependencies
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Backend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'Backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'Frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-*.sarif'
        continue-on-error: true

      - name: Run npm audit on Backend
        working-directory: ./Backend
        run: npm audit --production || true
        continue-on-error: true

      - name: Run npm audit on Frontend
        working-directory: ./Frontend
        run: npm audit --production || true
        continue-on-error: true

  # Dependency Check
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependency-check Backend
        uses: dependency-check/Dependency-check_Action@main
        with:
          project: 'Backend'
          path: 'Backend'
          format: 'JSON'
        continue-on-error: true

  # Summary Status
  tests-summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test, flutter-build, code-quality, security-scan]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.ai-service-test.result }}" != "success" ] || \
             [ "${{ needs.flutter-build.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      - name: Summary Comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const summary = `## CI Status Report
            - Backend: ${{ needs.backend-test.result }}
            - Frontend: ${{ needs.frontend-test.result }}
            - AI Service: ${{ needs.ai-service-test.result }}
            - Flutter: ${{ needs.flutter-build.result }}
            - Code Quality: ${{ needs.code-quality.result }}
            - Security: ${{ needs.security-scan.result }}
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
